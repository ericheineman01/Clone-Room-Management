<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Clone Timeline">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Clone Timeline</title>
<style>
:root{color-scheme:dark;--bg:#101a18;--panel:#1a2824;--panel2:#22332e;--text:#f2f5f1;--muted:#a9b9b0;--accent:#b7e3c6;--line:#344840;--danger:#ffb4a9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 16px calc(28px + env(safe-area-inset-bottom));}
main{max-width:620px;margin:0 auto}.top{padding:24px 2px 18px}.eyebrow{color:var(--accent);font-size:12px;font-weight:750;letter-spacing:.12em;text-transform:uppercase}.today{font-size:clamp(27px,7vw,38px);font-weight:800;letter-spacing:-.04em;margin:7px 0 4px}.sub{color:var(--muted);font-size:14px}
.toolbar{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px}.toolbar h2{font-size:18px;margin:0}.add{border:0;border-radius:999px;background:var(--accent);color:#102019;padding:11px 16px;font-weight:800;font-size:14px}
.cards{display:grid;gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.task{font-weight:750;font-size:17px;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:13px;margin-top:5px}.date{text-align:right}.weekday{font-weight:800;font-size:18px}.datefull{color:var(--muted);font-size:13px;margin-top:4px}.actions{display:flex;gap:7px;grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}.small{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:8px 12px;font-weight:650}.small.delete{color:var(--danger);margin-left:auto}.empty{padding:28px 18px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:18px;color:var(--muted);line-height:1.5}
.note{margin:18px 2px;color:var(--muted);font-size:12px;line-height:1.5}
dialog{width:min(100% - 28px,480px);border:1px solid var(--line);border-radius:22px;background:var(--panel);color:var(--text);padding:22px;box-shadow:0 20px 80px #0009}
dialog::backdrop{background:#0009}dialog h2{margin:0 0 18px;font-size:21px}.field{display:block;margin:14px 0}.field span{display:block;font-size:13px;color:var(--muted);margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid var(--line);border-radius:12px;background:#101a18;color:var(--text);font-size:17px}.rowbtn{display:flex;gap:10px;margin-top:22px}.rowbtn button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);font-weight:750;font-size:15px}.save{background:var(--accent);color:#102019;border-color:var(--accent)!important}.cancel{background:var(--panel2);color:var(--text)}button{cursor:pointer}
</style>
</head>
<body>
<main>
  <header class="top">
    <div class="eyebrow">Your daily clone checklist</div>
    <div class="today" id="today"></div>
    <div class="sub">Your intervals are calculated from today and update automatically.</div>
  </header>
  <div class="toolbar"><h2>Today's timepoints</h2><button class="add" id="add">＋ Add interval</button></div>
  <section class="cards" id="cards"></section>
  <p class="note">Changes are saved on this device. For the most reliable offline use, open the installed Home Screen app at least once while online after adding it.</p>
</main>
<dialog id="editor">
  <form id="form" method="dialog">
    <h2 id="dialogTitle">Add interval</h2>
    <label class="field"><span>Task name</span><input id="task" maxlength="60" placeholder="e.g. Transplant clones" required></label>
    <label class="field"><span>Days ago</span><input id="days" type="number" min="0" max="3650" step="1" inputmode="numeric" required></label>
    <div class="rowbtn"><button class="cancel" type="button" id="cancel">Cancel</button><button class="save" type="submit">Save interval</button></div>
  </form>
</dialog>
<script>
const defaults=[
  {id:crypto.randomUUID(),task:"2-day task",days:2},
  {id:crypto.randomUUID(),task:"7-day task",days:7},
  {id:crypto.randomUUID(),task:"12-day task",days:12},
  {id:crypto.randomUUID(),task:"14-day task",days:14}
];
let items;
try { items=JSON.parse(localStorage.getItem("cloneIntervalsV1")) || defaults; } catch { items=defaults; }
let editing=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem("cloneIntervalsV1",JSON.stringify(items));render();}
function dateAgo(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()-n);return d;}
function fmt(d,opts){return new Intl.DateTimeFormat(undefined,opts).format(d);}
function render(){
 const now=new Date();
 $("today").textContent=fmt(now,{weekday:"long",month:"long",day:"numeric",year:"numeric"});
 const cards=$("cards");cards.innerHTML="";
 if(!items.length){cards.innerHTML='<div class="empty">No intervals yet.<br>Tap “Add interval” to create your first task.</div>';return;}
 [...items].sort((a,b)=>a.days-b.days).forEach(item=>{
  const d=dateAgo(item.days), card=document.createElement("article");card.className="card";
  const left=document.createElement("div"),right=document.createElement("div");
  const task=document.createElement("div");task.className="task";task.textContent=item.task;
  const meta=document.createElement("div");meta.className="meta";meta.textContent=`${item.days} ${item.days===1?"day":"days"} ago`;
  left.append(task,meta);
  right.className="date";
  const weekday=document.createElement("div");weekday.className="weekday";weekday.textContent=fmt(d,{weekday:"long"});
  const date=document.createElement("div");date.className="datefull";date.textContent=fmt(d,{month:"short",day:"numeric",year:"numeric"});
  right.append(weekday,date);card.append(left,right);
  const actions=document.createElement("div");actions.className="actions";
  const edit=document.createElement("button");edit.className="small";edit.textContent="Edit";edit.onclick=()=>openEditor(item);
  const del=document.createElement("button");del.className="small delete";del.textContent="Remove";del.onclick=()=>{items=items.filter(x=>x.id!==item.id);save();};
  actions.append(edit,del);card.append(actions);cards.append(card);
 });
}
function openEditor(item=null){
 editing=item?.id??null;$("dialogTitle").textContent=item?"Edit interval":"Add interval";
 $("task").value=item?.task??"";$("days").value=item?.days??"";$("editor").showModal();$("task").focus();
}
$("add").onclick=()=>openEditor();
$("cancel").onclick=()=>$("editor").close();
$("form").onsubmit=e=>{
 e.preventDefault();const task=$("task").value.trim(),days=Number($("days").value);
 if(!task||!Number.isInteger(days)||days<0||days>3650)return;
 if(editing){const found=items.find(x=>x.id===editing);if(found){found.task=task;found.days=days;}}
 else items.push({id:crypto.randomUUID(),task,days});
 save();$("editor").close();
};
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
</body>
</html>
